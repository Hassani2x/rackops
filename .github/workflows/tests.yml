name: RackOps Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: python -m pip install playwright==1.60.0

      - name: Install Chromium and dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run six structure checks
        run: python test_rackops.py

      - name: Run six browser tests
        run: python test_browser.py
